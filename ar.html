<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#171139">
  <meta name="description" content="Portafolio AR Developer de Luisa Leaccott.">
  <title>AR Developer — Luisa Leaccott</title>
  <link rel="icon" href="Img/Logosvectores/LogoLuisa.svg">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/video.css">
  <link rel="stylesheet" href="css/landing.css">
  <link rel="stylesheet" href="css/case-ultimo.css">
  <link rel="stylesheet" href="css/showcase.css">
</head>
<body class="projects-page showcase-page" data-showcase="ar">
  <header class="projects-topbar" aria-label="Navegación del portafolio">
    <a class="projects-brand" href="index.html#portfolio" aria-label="Volver al portafolio principal"><img src="Img/Figma/Portafolio/logo-luisa.svg" alt=""></a>
    <button class="language projects-language" id="languageButton" type="button">EN</button>
  </header>
  <main>
    <section class="unity-portfolio" aria-labelledby="projectsTitle">
      <div class="unity-portfolio__backdrop" aria-hidden="true"></div>
      <div class="landing-sparkles" aria-hidden="true"></div>
      <img class="unity-portfolio__portrait" src="Img/Figma/Portafolio/luisa-sentada-portafolio.webp" alt="Ilustración de Luisa Leaccott sentada">
      <div class="unity-portfolio__intro">
        <h1 id="projectsTitle">AR Developer</h1>
        <p class="unity-portfolio__kicker" id="projectsKicker">Portafolio</p>
        <div class="unity-portfolio__description" id="projectsDescription"></div>
      </div>
      <nav class="project-grid" id="projectGrid" aria-label="Proyectos"></nav>
    </section>
    <div id="showcaseSections"></div>
    <a class="case-return" id="backLink" href="index.html#portfolio"><span>Volver al portafolio</span> <b aria-hidden="true">↑</b></a>
  </main>
  <script src="js/video.js"></script>
  <script src="js/showcase-content.js"></script>
  <script src="js/showcase.js"></script>
  <script src="js/landing.js"></script>
</body>
</html>
